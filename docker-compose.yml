name: agente-atendimento

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev_only}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
