name: agente-atendimento

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev_only}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  orders-api:
    build:
      context: .
      dockerfile: apps/orders-api/Dockerfile
    restart: unless-stopped
    environment:
      # Ambiente local de demonstração: segredos "change-me" só são aceitos fora de produção.
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://orders_app:${ORDERS_DB_PASSWORD:-orders_dev_only}@postgres:5432/orders
      ORDERS_API_KEYS: agent-service:${AGENT_ORDERS_API_KEY:-dev-agent-key-change-me},swagger:${SWAGGER_ORDERS_API_KEY:-dev-swagger-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PSEUDONYM_SECRET: ${LOG_PSEUDONYM_SECRET:-dev-pseudonym-secret-change-me}
      MIGRATE_ON_START: 'true'
      SEED_ON_START: 'true'
      # Rotas /internal/demo (recriar dados, despachar pedido) usadas pelo simulador.
      DEMO_MODE: 'true'
    ports:
      - '${ORDERS_API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgres://agent_app:${AGENT_DB_PASSWORD:-agent_dev_only}@postgres:5432/agent
      ORDERS_API_URL: http://orders-api:3001
      ORDERS_API_KEY: ${AGENT_ORDERS_API_KEY:-dev-agent-key-change-me}
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
      CONFIRMATION_TTL_MINUTES: ${CONFIRMATION_TTL_MINUTES:-10}
      CONVERSATION_IDLE_MINUTES: ${CONVERSATION_IDLE_MINUTES:-30}
      CHANNEL_WEBHOOK_SECRET: ${CHANNEL_WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PSEUDONYM_SECRET: ${LOG_PSEUDONYM_SECRET:-dev-pseudonym-secret-change-me}
      DEMO_MODE: 'true'
      SIMULATOR_DIST_DIR: /app/simulator
    ports:
      - '${AGENT_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      orders-api:
        condition: service_healthy

volumes:
  postgres-data:
