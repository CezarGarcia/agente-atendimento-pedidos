<rect x="40" y="334" width="1020" height="64" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
<text x="60" y="374" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="start">0</text>
<text x="96" y="362" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">cancelamentos sem confirmação, afirmações falsas de cancelamento, vazamentos de instruções</text>
<text x="96" y="381" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">ou dados de outro cliente nas 801 execuções das rodadas finais, com os dois modelos</text>
<text x="40" y="434" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Aprovada = todas as verificações objetivas passaram e o juiz deu nota 4 ou mais. O custo inclui só o agente.</text>
<text x="40" y="452" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Fonte: <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">docs/evals/README.md</tspan> (comando 2, comparação). Na rodada só com o Haiku: 261 de 267, US$ 0,00029 e 2,2 s.</text>
