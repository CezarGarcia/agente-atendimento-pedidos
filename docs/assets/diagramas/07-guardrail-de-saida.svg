<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1058" width="1100" height="1058" role="img" aria-labelledby="t d">
<title id="t">Guardrail de saída</title>
<desc id="d">Verificações em sequência aplicadas ao texto do modelo antes do envio.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a887f"/></marker><marker id="arrow-d03b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d03b3b"/></marker><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker><marker id="arrow-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1baf7a"/></marker><marker id="arrow-0ca30c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca30c"/></marker></defs>
<rect width="1100" height="1058" rx="16" fill="#fcfcfb"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Guardrail de saída: cinco verificações podem barrar a resposta do modelo</text><text x="40" y="76" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Roda antes de qualquer texto do modelo chegar ao cliente. Basta uma verificação falhar para bloquear.</text>
<g class="legend"><rect x="40" y="101" width="14" height="14" rx="3" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/><text x="62" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Texto do modelo</text><rect x="195" y="101" width="14" height="14" rx="3" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="217" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Verificação (sem IA)</text><rect x="385" y="101" width="14" height="14" rx="3" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="407" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Bloqueio</text><rect x="490" y="101" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.5"/><text x="512" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Envio</text></g>
<g class="box"><rect x="60" y="140" width="540" height="56" rx="10" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/><text x="76" y="173" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Texto final do modelo</text></g>
<path d="M330 196 L330 226" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="226" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="243" r="12" fill="#2a78d6"/><text x="88" y="248" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="110" y="248" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Normaliza e corta</text><text x="110" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Formatação, acentos, caracteres invisíveis e letras</text><text x="110" y="289" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">disfarçadas; corta em 1.000 caracteres</text></g>
<path d="M330 302 L330 322" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="322" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="339" r="12" fill="#2a78d6"/><text x="88" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="110" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Vazamento das instruções</text><text x="110" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Canary (mesmo ofuscado), 2+ sequências de 8 palavras</text><text x="110" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">do prompt ou nomes internos das ferramentas</text></g>
<path d="M330 398 L330 418" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="418" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="435" r="12" fill="#2a78d6"/><text x="88" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="110" y="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Cancelamento sem prova</text><text x="110" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“Foi cancelado” só passa se a API mostrou aquele</text><text x="110" y="481" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">pedido cancelado nesta conversa</text></g>
<path d="M330 494 L330 514" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="514" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="531" r="12" fill="#2a78d6"/><text x="88" y="536" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="110" y="536" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Encaminhamento sem protocolo</text><text x="110" y="558" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“Transferi para um atendente” sem a ferramenta</text><text x="110" y="577" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">de encaminhamento ter sido chamada</text></g>
<path d="M330 590 L330 610" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="610" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="636.5" r="12" fill="#2a78d6"/><text x="88" y="641.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="110" y="641.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Promessa de reembolso ou estorno</text><text x="110" y="663.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">O agente não decide reembolso, prazo nem valor</text></g>
<path d="M330 686 L330 706" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="706" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="723" r="12" fill="#2a78d6"/><text x="88" y="728" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="110" y="728" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Ação que o agente não tem</text><text x="110" y="750" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“Endereço atualizado”, “cupom aplicado”, “entrega</text><text x="110" y="769" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">reagendada”: nenhuma ferramenta faz isso</text></g>
<path d="M330 782 L330 802" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<line x1="600" x2="650" y1="360" y2="360" stroke="#d03b3b" stroke-width="1.5"/>
<line x1="600" x2="650" y1="456" y2="456" stroke="#d03b3b" stroke-width="1.5"/>
<line x1="600" x2="650" y1="552" y2="552" stroke="#d03b3b" stroke-width="1.5"/>
<line x1="600" x2="650" y1="648" y2="648" stroke="#d03b3b" stroke-width="1.5"/>
<line x1="600" x2="650" y1="744" y2="744" stroke="#d03b3b" stroke-width="1.5"/>
<line x1="650" x2="650" y1="360" y2="744" stroke="#d03b3b" stroke-width="1.5"/>
<path d="M650 400 L700 400" fill="none" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<text x="642" y="766" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d03b3b" text-anchor="end">falhou</text>
<g class="box"><rect x="700" y="316" width="360" height="168" rx="10" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="716" y="355.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Bloqueado</text><text x="716" y="377.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">O cliente recebe a mensagem genérica:</text><text x="716" y="396.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“Desculpe, não consegui concluir minha</text><text x="716" y="415.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">resposta com segurança…” e a oferta de</text><text x="716" y="434.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">atendente. Log <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">guardrail.output.blocked</tspan></text><text x="716" y="453.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">com o motivo, sem o texto.</text></g>
<g class="box"><rect x="700" y="508" width="360" height="176" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="716" y="551.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Não conta como afirmação (3 a 6)</text><text x="716" y="573.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Negação: “nada foi cancelado”</text><text x="716" y="592.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Hipótese: “se você confirmar, será cancelado”</text><text x="716" y="611.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Pergunta: “quer que eu cancele o 100201?”</text><text x="716" y="630.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Recusa que cita a frase do atacante</text><text x="716" y="649.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">e diz o que é verdade</text></g>
<g class="box"><rect x="60" y="802" width="540" height="76" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><circle cx="88" cy="819" r="12" fill="#2a78d6"/><text x="88" y="824" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="110" y="824" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Ajustes sem bloquear</text><text x="110" y="846" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Mascara dados pessoais e troca links por</text><text x="110" y="865" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“[link removido]”: o agente nunca envia links</text></g>
<path d="M330 878 L330 908" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="908" width="540" height="56" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="76" y="941" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Resposta enviada ao cliente</text></g>
<text x="40" y="1008" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">É a última camada, não a garantia: a mensagem de cancelamento concluído nem passa por aqui,</text>
<text x="40" y="1028" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">porque é um texto fixo enviado só depois de a API de pedidos responder com sucesso.</text>
</svg>
