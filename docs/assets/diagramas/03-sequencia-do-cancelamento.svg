<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1250" width="1120" height="1250" role="img" aria-labelledby="t d">
<title id="t">Sequência do cancelamento</title>
<desc id="d">Diagrama de sequência entre cliente, agente, modelo e API de pedidos nos dois turnos do cancelamento, com o caminho de falha.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a887f"/></marker><marker id="arrow-d03b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d03b3b"/></marker><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker><marker id="arrow-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1baf7a"/></marker><marker id="arrow-0ca30c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca30c"/></marker></defs>
<rect width="1120" height="1250" rx="16" fill="#fcfcfb"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Cancelamento em dois turnos: o modelo propõe, o cliente confirma, a API executa</text><text x="40" y="76" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">No turno da confirmação o modelo nem é chamado. Uma falha vira “não consegui confirmar”, nunca “cancelado”.</text>
<line x1="130" x2="130" y1="150" y2="1220" stroke="#c9c7c0" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="450" x2="450" y1="150" y2="1220" stroke="#c9c7c0" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="730" x2="730" y1="150" y2="1220" stroke="#c9c7c0" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="990" x2="990" y1="150" y2="1220" stroke="#c9c7c0" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class="box"><rect x="30" y="104" width="200" height="46" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="130" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">Cliente</text></g>
<g class="box"><rect x="350" y="104" width="200" height="46" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="450" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">Agente (código)</text></g>
<g class="box"><rect x="630" y="104" width="200" height="46" rx="10" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/><text x="730" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">Modelo (Haiku 5.5)</text></g>
<g class="box"><rect x="890" y="104" width="200" height="46" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><text x="990" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="middle">API de pedidos</text></g>
<rect x="24" y="170" width="1072" height="420" rx="10" fill="#f1f0eb" fill-opacity="0.55"/>
<g class="pill"><rect x="30" y="176" width="189" height="22" rx="11" fill="#f5f4f0"/><text x="37" y="192" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Turno 1 · o cliente pede</text></g>
<path d="M130 222 L448 222" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="171" y="197.5" width="238" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="213" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">“Quero cancelar o pedido 100201”</text></g>
<path d="M450 268 L728 268" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="478" y="243.5" width="224" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="590" y="259" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">histórico + mensagem mascarada</text></g>
<path d="M730 314 L452 314" fill="none" stroke="#8a887f" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="457" y="289.5" width="266" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="590" y="305" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">chama solicitar_cancelamento(100201)</text></g>
<path d="M450 360 L988 360" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="580" y="335.5" width="280" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="351" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">GET pedido 100201 do cliente da sessão</text></g>
<path d="M990 406 L452 406" fill="none" stroke="#8a887f" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="601" y="381.5" width="238" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="397" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">em processamento · pode cancelar</text></g>
<g class="box"><rect x="300" y="428" width="300" height="60" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="450" y="453" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">Cria a ação pendente: id = chave,</text><text x="450" y="472" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">expira em 10 minutos</text></g>
<path d="M450 530 L132 530" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="181.5" y="505.5" width="217" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="521" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">pergunta fixa com [Sim] [Não]</text></g>
<g class="box"><rect x="620" y="500" width="220" height="60" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="730" y="525" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">Não escreve a pergunta:</text><text x="730" y="544" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">o texto é fixo</text></g>
<rect x="24" y="610" width="1072" height="330" rx="10" fill="#f1f0eb" fill-opacity="0.55"/>
<g class="pill"><rect x="30" y="616" width="218" height="22" rx="11" fill="#f5f4f0"/><text x="37" y="632" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Turno 2 · o cliente confirma</text></g>
<path d="M130 662 L448 662" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="143" y="637.5" width="294" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="653" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">toca “Sim, cancelar” (leva o id da ação)</text></g>
<g class="box"><rect x="300" y="684" width="300" height="60" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="450" y="709" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">Confirmação por código</text><text x="450" y="728" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">aguardando → executando (atômico)</text></g>
<g class="box"><rect x="620" y="684" width="220" height="60" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="730" y="709" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">Não é chamado</text><text x="730" y="728" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">neste turno</text></g>
<path d="M450 790 L988 790" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="573" y="765.5" width="294" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="781" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">POST cancelamento · Idempotency-Key = id</text></g>
<g class="box"><rect x="875" y="812" width="230" height="60" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><text x="990" y="837" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">Transação, pedido travado,</text><text x="990" y="856" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">revalida o status</text></g>
<path d="M990 890 L452 890" fill="none" stroke="#8a887f" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="660.5" y="865.5" width="119" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="881" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">200 · CANCELLED</text></g>
<path d="M450 920 L132 920" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="153.5" y="895.5" width="273" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="911" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">texto fixo: “Pedido 100201 cancelado”</text></g>
<rect x="24" y="960" width="1072" height="250" rx="10" fill="none" stroke="#d03b3b" stroke-width="1.25" stroke-dasharray="6 4"/>
<g class="pill"><rect x="30" y="966" width="232" height="22" rx="11" fill="#fcfcfb"/><text x="37" y="982" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d03b3b" text-anchor="start">Se a API não responder a tempo</text></g>
<path d="M990 1012 L452 1012" fill="none" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<g class="pill"><rect x="604.5" y="987.5" width="231" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="1003" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">timeout: resultado desconhecido</text></g>
<path d="M450 1058 L132 1058" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="171" y="1033.5" width="238" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="1049" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">“Não consegui confirmar” + botão</text></g>
<path d="M130 1104 L448 1104" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="202.5" y="1079.5" width="175" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="290" y="1095" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">toca “Tentar novamente”</text></g>
<path d="M450 1150 L988 1150" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="601" y="1125.5" width="238" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="1141" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">POST com a MESMA Idempotency-Key</text></g>
<path d="M990 1196 L452 1196" fill="none" stroke="#8a887f" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="580" y="1171.5" width="280" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="720" y="1187" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">resposta gravada (Idempotent-Replayed)</text></g>
</svg>
