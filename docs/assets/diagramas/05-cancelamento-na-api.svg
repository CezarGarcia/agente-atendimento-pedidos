<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 974" width="1100" height="974" role="img" aria-labelledby="t d">
<title id="t">Cancelamento na API de pedidos</title>
<desc id="d">Etapas da requisição de cancelamento na API: validação, idempotência, trava do pedido, regra do domínio e gravação.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a887f"/></marker><marker id="arrow-d03b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d03b3b"/></marker><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker><marker id="arrow-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1baf7a"/></marker><marker id="arrow-0ca30c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca30c"/></marker></defs>
<rect width="1100" height="974" rx="16" fill="#fcfcfb"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Na API, a regra é decidida numa transação com o pedido travado</text><text x="40" y="76" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Mesmo que o agente erre, a API só cancela pedido em processamento, do próprio cliente, uma vez por chave.</text>
<g class="legend"><rect x="40" y="101" width="14" height="14" rx="3" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><text x="62" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Etapa da API</text><rect x="173" y="101" width="14" height="14" rx="3" fill="#e8f6e8" stroke="#0ca30c" stroke-width="1.5"/><text x="195" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Sucesso</text><rect x="271" y="101" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.5"/><text x="293" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Resposta repetida</text><rect x="440" y="101" width="14" height="14" rx="3" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="462" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Erro devolvido</text></g>
<g class="box"><rect x="60" y="140" width="540" height="76" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><circle cx="88" cy="157" r="12" fill="#1baf7a"/><text x="88" y="162" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="110" y="162" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Requisição do agente</text><text x="110" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start"><tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">POST …/orders/{pedido}/cancellation</tspan></text><text x="110" y="203" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Cabeçalho <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">Idempotency-Key</tspan> + chave de API</text></g>
<path d="M330 216 L330 246" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="246" width="540" height="80" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><circle cx="88" cy="265" r="12" fill="#1baf7a"/><text x="88" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="110" y="270" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Validação com Zod</text><text x="110" y="292" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Cliente, pedido com 6 dígitos e formato da chave;</text><text x="110" y="311" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">motivo até 500 caracteres, com PII mascarada</text></g>
<path d="M330 326 L330 356" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="356" width="540" height="80" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><circle cx="88" cy="375" r="12" fill="#1baf7a"/><text x="88" y="380" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="110" y="380" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">BEGIN e registro da chave</text><text x="110" y="402" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start"><tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">INSERT … ON CONFLICT DO NOTHING</tspan></text><text x="110" y="421" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Guarda um hash de pedido + motivo</text></g>
<path d="M330 436 L330 466" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="466" width="540" height="80" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><circle cx="88" cy="485" r="12" fill="#1baf7a"/><text x="88" y="490" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="110" y="490" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Busca o pedido com <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">FOR UPDATE</tspan></text><text x="110" y="512" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Só entre os pedidos deste cliente</text><text x="110" y="531" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Outra transação no mesmo pedido espera aqui</text></g>
<g class="box"><rect x="680" y="258" width="380" height="56" rx="10" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="696" y="279.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">400 ou 401</text><text x="696" y="301.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Entrada inválida ou chave de API errada</text></g>
<path d="M600 286 L680 286" fill="none" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<g class="box"><rect x="680" y="338" width="380" height="56" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="696" y="359.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Mesma chave, mesma requisição</text><text x="696" y="381.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Devolve a resposta gravada (replay)</text></g>
<path d="M600 366 L680 366" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="680" y="402" width="380" height="56" rx="10" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="696" y="423.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">422 · chave reutilizada</text><text x="696" y="445.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Mesma chave com outro pedido ou motivo</text></g>
<path d="M600 426 L680 426" fill="none" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<g class="box"><rect x="680" y="478" width="380" height="56" rx="10" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="696" y="499.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">404 · pedido não encontrado</text><text x="696" y="521.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Inexistente ou de outro cliente</text></g>
<path d="M600 506 L680 506" fill="none" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<path d="M330 546 L330 562" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="diamond"><polygon points="110,616 330,562 550,616 330,670" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><text x="330" y="612" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="middle">5 · Regra do domínio</text><text x="330" y="630" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="middle">status é “em processamento”?</text></g>
<g class="box"><rect x="680" y="588" width="380" height="56" rx="10" fill="#fcebeb" stroke="#d03b3b" stroke-width="1.5"/><text x="696" y="609.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">409 · não pode ser cancelado</text><text x="696" y="631.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Com o motivo: já enviado, entregue…</text></g>
<path d="M550 616 L680 616" fill="none" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arrow-d03b3b)" stroke-linejoin="round"/>
<text x="560" y="662" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Mapa exaustivo por status;</text>
<text x="560" y="678" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">status desconhecido = não</text>
<path d="M330 670 L330 710" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="354" y="678.5" width="35" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="361" y="694" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="start">sim</text></g>
<g class="box"><rect x="60" y="710" width="540" height="80" rx="10" fill="#e4f5ee" stroke="#1baf7a" stroke-width="1.5"/><circle cx="88" cy="729" r="12" fill="#1baf7a"/><text x="88" y="734" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="110" y="734" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Grava o cancelamento</text><text x="110" y="756" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Status Cancelado + histórico de status (quem, motivo,</text><text x="110" y="775" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">correlation id) + resultado guardado na chave</text></g>
<path d="M330 790 L330 820" fill="none" stroke="#0ca30c" stroke-width="1.5" marker-end="url(#arrow-0ca30c)" stroke-linejoin="round"/>
<g class="box"><rect x="60" y="820" width="540" height="60" rx="10" fill="#e8f6e8" stroke="#0ca30c" stroke-width="1.5"/><circle cx="88" cy="850" r="12" fill="#0ca30c"/><text x="88" y="855" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="110" y="855" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">COMMIT · 200 com o pedido cancelado</text></g>
<text x="40" y="924" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Os desfechos 404 e 409 também ficam guardados na chave: repetir a mesma requisição devolve a mesma resposta.</text>
<text x="40" y="944" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Cada desfecho gera um evento de log: <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">order.cancellation.succeeded</tspan>, <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">.rejected</tspan>, <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">.not_found</tspan> ou <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">.idempotency_mismatch</tspan>.</text>
</svg>
