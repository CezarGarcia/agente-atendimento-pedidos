<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 812" width="1100" height="812" role="img" aria-labelledby="t d">
<title id="t">Estados da confirmação</title>
<desc id="d">Máquina de estados da ação pendente de cancelamento.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a887f"/></marker><marker id="arrow-d03b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d03b3b"/></marker><marker id="arrow-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker><marker id="arrow-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker><marker id="arrow-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1baf7a"/></marker><marker id="arrow-0ca30c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca30c"/></marker></defs>
<rect width="1100" height="812" rx="16" fill="#fcfcfb"/>
<text x="40" y="48" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Estados da confirmação: só “executando” chama a API</text><text x="40" y="76" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Cada pedido de cancelamento vira uma ação pendente. No máximo uma fica aberta por conversa.</text>
<g class="legend"><rect x="40" y="101" width="14" height="14" rx="3" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="62" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Estado aberto</text><rect x="180" y="101" width="14" height="14" rx="3" fill="#e8f6e8" stroke="#0ca30c" stroke-width="1.5"/><text x="202" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Cancelado</text><rect x="292" y="101" width="14" height="14" rx="3" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.5"/><text x="314" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Encerrado sem cancelar</text></g>
<rect x="30" y="150" width="690" height="380" rx="14" fill="#f4f3ef" stroke="#c9c7c0" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="50" y="512" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start">Estados abertos: no máximo um por conversa (índice único no PostgreSQL)</text>
<circle cx="155" cy="170" r="7" fill="#0b0b0b"/>
<path d="M155 177 L155 200" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="172" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start"><tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">solicitar_cancelamento</tspan> com pedido cancelável</text>
<g class="box"><rect x="50" y="200" width="226" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="66" y="225.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Aguardando</text><text x="66" y="247.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Pergunta enviada com botões</text></g>
<g class="box"><rect x="440" y="200" width="230" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="456" y="225.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Executando</text><text x="456" y="247.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Uma só instância chama a API</text></g>
<g class="box"><rect x="440" y="390" width="230" height="64" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="456" y="415.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Resultado desconhecido</text><text x="456" y="437.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“Não consegui confirmar”</text></g>
<path d="M276 232 L440 232" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="358" y="222" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">botão Sim ou “sim”</text>
<text x="358" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">logo após a pergunta</text>
<path d="M510 264 L510 390" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="498" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end">timeout ou</text>
<text x="498" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="end">erro técnico</text>
<path d="M600 390 L600 264" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="612" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Tentar de novo</text>
<text x="612" y="338" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">(mesma chave)</text>
<g class="box"><rect x="790" y="150" width="270" height="72" rx="10" fill="#e8f6e8" stroke="#0ca30c" stroke-width="1.5"/><text x="806" y="179.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Concluída</text><text x="806" y="201.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">A API respondeu 200</text></g>
<g class="box"><rect x="790" y="250" width="270" height="72" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="806" y="279.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Recusada pela API</text><text x="806" y="301.5" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">404 ou 409: não cancelável</text></g>
<path d="M670 216 L740 216 L740 186 L790 186" fill="none" stroke="#0ca30c" stroke-width="1.5" marker-end="url(#arrow-0ca30c)" stroke-linejoin="round"/>
<path d="M670 248 L740 248 L740 286 L790 286" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="50" y="610" width="200" height="84" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="66" y="636" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Substituída</text><text x="66" y="658" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Nova solicitação, ou um</text><text x="66" y="677" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">turno que não foi enviado</text></g>
<path d="M150 530 L150 610" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="290" y="610" width="200" height="84" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="306" y="636" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Mantida</text><text x="306" y="658" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Botão Não, “não”</text><text x="306" y="677" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">ou “Agora não”</text></g>
<path d="M390 530 L390 610" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="box"><rect x="530" y="610" width="200" height="84" rx="10" fill="#ffffff" stroke="#c9c7c0" stroke-width="1.25"/><text x="546" y="636" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Expirada</text><text x="546" y="658" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">10 minutos sem</text><text x="546" y="677" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">resposta</text></g>
<path d="M630 530 L630 610" fill="none" stroke="#8a887f" stroke-width="1.5" marker-end="url(#arrow)" stroke-linejoin="round"/>
<g class="pill"><rect x="218.5" y="556.5" width="343" height="21.5" rx="10.75" fill="#fcfcfb"/><text x="390" y="572" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="middle">saem de Aguardando ou de Resultado desconhecido</text></g>
<text x="40" y="740" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Os botões levam o id da ação: um botão antigo não confirma uma ação nova.</text>
<text x="40" y="760" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Esse mesmo id é a <tspan font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="0.92em">Idempotency-Key</tspan> enviada à API, por isso “Tentar de novo” nunca cancela duas vezes.</text>
<text x="40" y="780" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Depois de “Agora não” num resultado desconhecido, o sistema consulta o pedido e conta o que a API mostra.</text>
</svg>
